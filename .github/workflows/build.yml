name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: aarch64-apple-darwin
            label: macos-arm
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            target: x86_64-apple-darwin
            label: macos-intel
          - platform: 'windows-latest'
            args: ''
            target: ''
            label: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0

      - name: Rename macOS Intel DMG
        if: matrix.label == 'macos-intel'
        run: |
          cd src-tauri/target/release/bundle/dmg
          for f in *.dmg; do
            mv "$f" "${f%.dmg}_x64.dmg"
          done

      - uses: actions/upload-artifact@v4
        if: matrix.label == 'windows'
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/msi/*.msi

      - uses: actions/upload-artifact@v4
        if: matrix.label == 'macos-arm'
        with:
          name: macos-arm-installer
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - uses: actions/upload-artifact@v4
        if: matrix.label == 'macos-intel'
        with:
          name: macos-intel-installer
          path: src-tauri/target/release/bundle/dmg/*.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            windows-installer/*.msi
            macos-arm-installer/*.dmg
            macos-intel-installer/*.dmg
          draft: true
          generate_release_notes: true